name: CI Pipeline

on:
  push:
    branches:
      - dev
      - test
      - uat
  pull_request:
    branches:
      - dev
      - test
      - uat
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Secret Leak & Code Linting Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validate Source Structure and Linting
        run: |
          if [ -d "project-source" ]; then
            cd project-source
          fi
          chmod +x mvnw
          ./mvnw clean compile -DskipTests -B

  test-suite:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [static-analysis]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maito_db
          POSTGRES_USER: maito_user
          POSTGRES_PASSWORD: maito_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Execute Full Test Suite
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/maito_db
          SPRING_DATASOURCE_USERNAME: maito_user
          SPRING_DATASOURCE_PASSWORD: maito_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: |
          if [ -d "project-source" ]; then
            cd project-source
          fi
          chmod +x mvnw
          ./mvnw clean test -B

      - name: Archive Test Results (Surefire Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14

  vulnerability-scan:
    name: Codebase & Dependency CVE Scan
    runs-on: ubuntu-latest
    needs: [static-analysis]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Trivy Repository Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
