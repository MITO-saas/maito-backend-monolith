apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: maito-platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@maito.io
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: ap-south-1
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maito-wildcard-tls
  namespace: maito-prod
  labels:
    app.kubernetes.io/part-of: maito-platform
spec:
  secretName: maito-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "maito.io"
  dnsNames:
    - "maito.io"
    - "*.maito.io"
