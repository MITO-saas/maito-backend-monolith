apiVersion: v1
kind: Service
metadata:
  name: {{ include "maito.fullname" . }}
  namespace: {{ .Values.namespace.name | default "maito-prod" }}
  labels:
    {{- include "maito.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "maito.selectorLabels" . | nindent 4 }}
