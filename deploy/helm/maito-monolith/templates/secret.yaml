apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maito.fullname" . }}-secret
  namespace: {{ .Values.namespace.name | default "maito-prod" }}
  labels:
    {{- include "maito.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgresql.password | default "maito_pass_k8s_2026" | quote }}
  SPRING_REDIS_PASSWORD: {{ .Values.redis.password | default "maito_redis_pass_k8s_2026" | quote }}
  JWT_SECRET: {{ .Values.env.JWT_SECRET | default "9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f" | quote }}
