version: '3.8'

services:
  # =========================================================================
  # PostgreSQL 16 - Relational Database for Maito Monolith
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: maito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maito_db
      POSTGRES_USER: maito_user
      POSTGRES_PASSWORD: maito_pass
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - maito_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maito_user -d maito_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - maito-network

  # =========================================================================
  # Redis 7.2 - Caching, Session & Idempotency Store
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: maito-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass maito_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - maito_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "maito_redis_pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - maito-network

  # =========================================================================
  # Apache Kafka (KRaft Mode - No ZooKeeper required)
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: maito-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://maito-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@maito-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - maito_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - maito-network

volumes:
  maito_postgres_data:
    driver: local
  maito_redis_data:
    driver: local
  maito_kafka_data:
    driver: local

networks:
  maito-network:
    driver: bridge
