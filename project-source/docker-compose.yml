version: '3.8'

services:
  # =========================================================================
  # PostgreSQL 16 - Multi-Tenant Relational Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: maito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maito_db}
      POSTGRES_USER: ${POSTGRES_USER:-maito_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maito_pass}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - maito_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multi-tenant-dbs.sql:/docker-entrypoint-initdb.d/01-init-multi-tenant-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maito_user} -d ${POSTGRES_DB:-maito_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - maito-network

  # =========================================================================
  # Redis 7 - Distributed Cache, Rate Limiter & Routing Cache
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: maito-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-maito_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - maito_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-maito_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - maito-network

    # =========================================================================
  # Elasticsearch 8 - Full-Text Search, Autocomplete & Faceted Aggregation
  # =========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: maito-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - maito_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - maito-network

# =========================================================================
  # Maito Backend Monolith - Spring Boot 3.3.x Application Container
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maito-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/maito_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-maito_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-maito_pass}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-maito_redis_pass}
      SPRING_ELASTICSEARCH_URIS: ${SPRING_ELASTICSEARCH_URIS:-http://elasticsearch:9200}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://tempo:9411/api/v2/spans}
      MAITO_RATE_LIMITING_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f}
      TZ: UTC
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - maito-network

  # =========================================================================
  # Nginx Gateway & Reverse Proxy - Wildcard Subdomain & Edge SSL/Routing
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: maito-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - maito-network

volumes:
  maito_postgres_data:
    driver: local
  maito_redis_data:
    driver: local

networks:
  maito-network:
    driver: bridge