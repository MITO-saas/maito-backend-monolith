server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: maito-backend-monolith
  profiles:
    active: local

  # Database DataSource Configuration (Local PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maito_db}
    username: ${SPRING_DATASOURCE_USERNAME:maito_user}
    password: ${SPRING_DATASOURCE_PASSWORD:maito_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Liquibase Migrations
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: false

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:maito_redis_pass}
      timeout: 3000ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: maito-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Springdoc / Swagger OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator Health, Metrics & Multi-Tenant Telemetry
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,tenants
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
    kafka:
      enabled: false

# Rate Limiting & Gateway Configuration
maito:
  gateway:
    rate-limiting:
      enabled: ${MAITO_RATE_LIMITING_ENABLED:true}

# Enterprise Platform Configurations
platform:
  security:
    isolated-db-users: ${PLATFORM_ISOLATED_DB_USERS:false}