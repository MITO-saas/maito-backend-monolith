server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: maito-backend-monolith
  profiles:
    active: local

  # Database DataSource Configuration (Local PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maito_db}
    username: ${SPRING_DATASOURCE_USERNAME:maito_user}
    password: ${SPRING_DATASOURCE_PASSWORD:maito_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Liquibase Migrations
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: false

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:maito_redis_pass}
      timeout: 3000ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: maito-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Springdoc / Swagger OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator Health, Metrics & Multi-Tenant Telemetry
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, tenants
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
    kafka:
      enabled: false
    elasticsearch:
      enabled: false
  metrics:
    tags:
      application: maito-backend-monolith
      environment: ${SPRING_PROFILES_ACTIVE:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms, 100ms, 250ms, 500ms, 1s, 2s
  tracing:
    sampling:
      probability: 1.0 # 100% in local/dev; adjust via env for prod
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://tempo:9411/api/v2/spans}
# Rate Limiting & Gateway Configuration
maito:
  search:
    elasticsearch:
      enabled: ${ELASTICSEARCH_ENABLED:true}
      uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
      connection-timeout-ms: 3000
      socket-timeout-ms: 5000
  gateway:
    rate-limiting:
      enabled: ${MAITO_RATE_LIMITING_ENABLED:true}
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_mock_key_2026}
      secret: ${RAZORPAY_KEY_SECRET:secret_mock_test_2026}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret_default_2026}
    stripe:
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_mock_key_2026}
      secret-key: ${STRIPE_SECRET_KEY:sk_test_mock_secret_2026}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_test_stripe_2026}
  fulfillment:
    webhook-secret: ${FULFILLMENT_WEBHOOK_SECRET:whsec_fulfillment_default_2026}
    delhivery:
      api-token: ${DELHIVERY_API_TOKEN:dummy_delhivery_token}
      base-url: ${DELHIVERY_BASE_URL:https://track.delhivery.com}
      sandbox: ${DELHIVERY_SANDBOX:true}
    shiprocket:
      api-token: ${SHIPROCKET_API_TOKEN:dummy_shiprocket_token}
      base-url: ${SHIPROCKET_BASE_URL:https://apiv2.shiprocket.in}
      sandbox: ${SHIPROCKET_SANDBOX:true}
  notification:
    email:
      provider: ${EMAIL_PROVIDER:SANDBOX}
      ses-region: ${AWS_SES_REGION:ap-south-1}
      from-address: ${EMAIL_FROM_ADDRESS:notifications@mitocrunch.com}
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:SANDBOX}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:1234567890}
      access-token: ${WHATSAPP_ACCESS_TOKEN:dummy_token}
    sms:
      provider: ${SMS_PROVIDER:SANDBOX}
      twilio-account-sid: ${TWILIO_ACCOUNT_SID:dummy_sid}
      twilio-auth-token: ${TWILIO_AUTH_TOKEN:dummy_token}
      twilio-from-number: ${TWILIO_FROM_NUMBER:+1234567890}

# Enterprise Platform Configurations
platform:
  security:
    isolated-db-users: ${PLATFORM_ISOLATED_DB_USERS:false}