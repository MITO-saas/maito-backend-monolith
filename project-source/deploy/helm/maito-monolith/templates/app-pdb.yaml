{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "maito.fullname" . }}-pdb
  namespace: {{ .Values.namespace.name | default "maito-prod" }}
  labels:
    {{- include "maito.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "maito.selectorLabels" . | nindent 6 }}
{{- end }}
