user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'tenant="$tenant_id" upstream_response_time=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Upstream backend pool
    upstream maito_backend {
        server app:8080;
        keepalive 32;
    }

    # Wildcard Subdomain Mapping to Tenant Slug
    map $http_host $mapped_tenant {
        ~^(?<tenant>[a-zA-Z0-9_-]+)\.maito\.io$ $tenant;
        default "";
    }

    server {
        listen 80;
        server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.maito\.io$ localhost maito.io *.maito.io;

        # 60-Second Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        send_timeout          60s;

        # Client IP and Protocol Headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Route Traffic to Application Container
        location / {
            # Tenant resolution logic with fallback to mito_crunch
            set $tenant_id $mapped_tenant;

            # If client explicitly provided X-Tenant-ID header, respect it
            if ($http_x_tenant_id != "") {
                set $tenant_id $http_x_tenant_id;
            }

            # If still unmapped, fallback to default tenant
            if ($tenant_id = "") {
                set $tenant_id "mito_crunch";
            }

            proxy_set_header X-Tenant-ID $tenant_id;

            proxy_pass http://maito_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Health probe endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}